[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "BELFAST"
version = "0.1.0"
description = "A Bayesian framework for estimating the ages of early-type stars with fast rotation"
readme = "README.md"
requires-python = ">=3.13.5"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "astropy>=5.0",
    "astroquery>=0.4",
    "corner>=2.2",
    "emcee>=3.1",
    "multiprocess>=0.70",
    "pyarrow>=12.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "selenium>=4.0",
    "statsmodels>=0.14",
    "torch>=2.0",
    "tqdm>=4.65",
    "urllib3>=2.0",
    "webdriver-manager>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["belfast*"]
